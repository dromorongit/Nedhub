<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Payment Successful - Nedhub">
    <title>Payment Successful | Nedhub</title>
    <link rel="icon" type="image/png" href="Nedhubsymbol.PNG">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0B132B 0%, #1a2342 50%, #2d3a5c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .payment-status-container {
            background: white;
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 520px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #10B981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 12px 40px rgba(16, 185, 129, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 16px 50px rgba(16, 185, 129, 0.5);
            }
        }

        .success-icon i {
            font-size: 3.5rem;
            color: white;
        }

        .payment-status-container h1 {
            color: #10B981;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .payment-status-container .subtitle {
            color: #6b7280;
            font-size: 1.1rem;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .order-details {
            background: #f8fafc;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 32px;
            text-align: left;
        }

        .order-details h3 {
            color: #0B132B;
            font-size: 1.1rem;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #6b7280;
            font-size: 0.95rem;
        }

        .detail-value {
            color: #0B132B;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .detail-value.success {
            color: #10B981;
        }

        .countdown-section {
            background: linear-gradient(135deg, #0B132B, #1a2342);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .countdown-section p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            margin-bottom: 16px;
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 20px;
            min-width: 70px;
        }

        .countdown-number {
            font-size: 2rem;
            font-weight: 700;
            color: #10B981;
            display: block;
        }

        .countdown-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #0B132B;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1000;
        }

        .confetti-piece {
            position: absolute;
            width: 12px;
            height: 12px;
            top: -20px;
            opacity: 0;
            animation: confetti-fall 4s ease-out forwards;
        }

        @keyframes confetti-fall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg);
            }
        }

        @media (max-width: 480px) {
            .payment-status-container {
                padding: 40px 24px;
            }

            .success-icon {
                width: 90px;
                height: 90px;
            }

            .success-icon i {
                font-size: 2.5rem;
            }

            .payment-status-container h1 {
                font-size: 1.6rem;
            }

            .countdown-item {
                padding: 12px 14px;
                min-width: 55px;
            }

            .countdown-number {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Confetti Animation Container -->
    <div class="confetti" id="confetti"></div>

    <!-- Main Content -->
    <main class="payment-status-container">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>

        <h1>Payment Successful!</h1>
        <p class="subtitle">Thank you for your purchase. Your CV template is ready for download.</p>

        <div class="order-details">
            <h3><i class="fas fa-receipt"></i> Order Details</h3>
            <div class="detail-row">
                <span class="detail-label">Transaction ID</span>
                <span class="detail-value" id="transaction-id">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Template</span>
                <span class="detail-value" id="template-name">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount Paid</span>
                <span class="detail-value success" id="amount-paid">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Date</span>
                <span class="detail-value" id="payment-date">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value success"><i class="fas fa-check-circle"></i> Completed</span>
            </div>
        </div>

        <div class="countdown-section">
            <p>Redirecting to CV Templates in <span id="countdown-text">10</span> seconds...</p>
            <div class="countdown-timer">
                <div class="countdown-item">
                    <span class="countdown-number" id="seconds">10</span>
                    <span class="countdown-label">Seconds</span>
                </div>
            </div>
        </div>

        <div class="btn-container">
            <a href="cv-templates.html" class="btn btn-primary">
                <i class="fas fa-download"></i> Download Template
            </a>
            <a href="index.html" class="btn btn-secondary">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </main>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const clientRef = urlParams.get('ref') || urlParams.get('clientReference');
        const checkoutId = urlParams.get('checkoutid');
        const status = urlParams.get('status');

        // Display transaction details
        document.getElementById('transaction-id').textContent = clientRef || checkoutId || 'NED-' + Date.now().toString().slice(-8);
        document.getElementById('payment-date').textContent = new Date().toLocaleDateString('en-GH', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });

        // Store payment data in localStorage for CV templates page
        if (checkoutId) {
            // Hubtel redirected with checkoutId - fetch payment details
            fetchPaymentDetailsByCheckoutId(checkoutId);
        } else if (clientRef) {
            // Fetch payment details using clientReference
            fetchPaymentDetails(clientRef);
        } else {
            // Use stored payment data
            const storedPayment = localStorage.getItem('lastPayment');
            if (storedPayment) {
                const payment = JSON.parse(storedPayment);
                displayPaymentDetails(payment);
            }
        }

        // Create confetti effect
        createConfetti();

        // Countdown timer
        let countdown = 10;
        const countdownElement = document.getElementById('seconds');
        const countdownTextElement = document.getElementById('countdown-text');

        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            countdownTextElement.textContent = countdown;

            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = 'cv-templates.html';
            }
        }, 1000);

        async function fetchPaymentDetails(clientReference) {
            try {
                const apiBaseUrl = 'https://nedhub-production.up.railway.app/api';
                const response = await fetch(`${apiBaseUrl}/payments/hubtel/status/${clientReference}`);
                const data = await response.json();

                if (data.success) {
                    const payment = data.data;
                    
                    // Store in localStorage
                    const paymentData = {
                        clientReference: payment.clientReference,
                        templateName: localStorage.getItem('pendingTemplateName') || 'CV Template',
                        amount: payment.amount,
                        status: payment.status,
                        paidAt: payment.paidAt
                    };
                    localStorage.setItem('lastPayment', JSON.stringify(paymentData));
                    localStorage.setItem(`purchased_${payment.clientReference}`, JSON.stringify(paymentData));
                    
                    // Also add to purchasedTemplates array for CV templates page
                    addToPurchasedTemplates(payment.clientReference);
                    
                    displayPaymentDetails(paymentData);
                }
            } catch (error) {
                console.error('Error fetching payment details:', error);
                // Use fallback data
                const fallbackData = {
                    templateName: localStorage.getItem('pendingTemplateName') || 'CV Template',
                    amount: localStorage.getItem('pendingAmount') || '0.00'
                };
                document.getElementById('template-name').textContent = fallbackData.templateName;
                document.getElementById('amount-paid').textContent = '₵' + fallbackData.amount;
            }
        }

        async function fetchPaymentDetailsByCheckoutId(checkoutId) {
            try {
                const apiBaseUrl = 'https://nedhub-production.up.railway.app/api';
                
                // First, try to find order by checkoutId
                // Since we don't have a direct endpoint, we'll use the stored pendingClientReference
                const pendingClientReference = localStorage.getItem('pendingClientReference');
                
                if (pendingClientReference) {
                    // Fetch payment details using clientReference
                    await fetchPaymentDetails(pendingClientReference);
                    return;
                }
                
                // If no pendingClientReference, try to get order by checkoutId
                const response = await fetch(`${apiBaseUrl}/orders/checkout/${checkoutId}`);
                const data = await response.json();

                if (data.success && data.data) {
                    const order = data.data;
                    
                    // Get stored template info
                    const templateName = localStorage.getItem('pendingTemplateName') || order.description?.replace('CV Template: ', '') || 'CV Template';
                    const templateId = localStorage.getItem('pendingTemplateId') || '';
                    
                    // Store payment data
                    const paymentData = {
                        clientReference: order.clientReference,
                        templateName: templateName,
                        templateId: templateId,
                        amount: order.amount,
                        status: order.status,
                        paidAt: order.paidAt || new Date().toISOString()
                    };
                    
                    localStorage.setItem('lastPayment', JSON.stringify(paymentData));
                    localStorage.setItem(`purchased_${order.clientReference}`, JSON.stringify(paymentData));
                    
                    // Add to purchasedTemplates array
                    addToPurchasedTemplatesWithId(templateId, templateName, order.amount);
                    
                    displayPaymentDetails(paymentData);
                } else {
                    throw new Error('Order not found');
                }
            } catch (error) {
                console.error('Error fetching payment details by checkoutId:', error);
                // Fallback: Mark as purchased using stored data
                const templateName = localStorage.getItem('pendingTemplateName') || 'CV Template';
                const templateId = localStorage.getItem('pendingTemplateId') || '';
                const amount = localStorage.getItem('pendingAmount') || '0.00';
                
                // Still add to purchased templates so download button appears
                addToPurchasedTemplatesWithId(templateId, templateName, amount);
                
                document.getElementById('template-name').textContent = templateName;
                document.getElementById('amount-paid').textContent = '₵' + amount;
            }
        }

        function addToPurchasedTemplates(clientReference) {
            // Get stored template info
            const templateName = localStorage.getItem('pendingTemplateName') || 'CV Template';
            const templateId = localStorage.getItem('pendingTemplateId') || '';
            const amount = localStorage.getItem('pendingAmount') || '0.00';
            
            addToPurchasedTemplatesWithId(templateId, templateName, amount);
        }

        function addToPurchasedTemplatesWithId(templateId, templateName, amount) {
            if (!templateId) return;
            
            // Remove 'cv-' prefix if present
            const cleanTemplateId = templateId.replace('cv-', '');
            
            // Get existing purchased templates
            let purchasedTemplates = JSON.parse(localStorage.getItem('purchasedTemplates')) || [];
            
            // Check if already purchased
            const alreadyPurchased = purchasedTemplates.some(t => t.id === cleanTemplateId);
            
            if (!alreadyPurchased) {
                purchasedTemplates.push({
                    id: cleanTemplateId,
                    name: templateName,
                    price: parseFloat(amount) || 0,
                    transactionId: checkoutId || 'NED-' + Date.now().toString().slice(-8),
                    date: new Date().toISOString()
                });
                
                localStorage.setItem('purchasedTemplates', JSON.stringify(purchasedTemplates));
                console.log('Template added to purchasedTemplates:', purchasedTemplates);
            }
        }

        function displayPaymentDetails(payment) {
            document.getElementById('template-name').textContent = payment.templateName || 'CV Template';
            document.getElementById('amount-paid').textContent = '₵' + (payment.amount || '0.00');
        }

        function createConfetti() {
            const colors = ['#10B981', '#F77F00', '#3B82F6', '#EC4899', '#8B5CF6'];
            const confettiContainer = document.getElementById('confetti');

            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confettiContainer.appendChild(confetti);
            }
        }

        // Manual redirect function
        function redirectNow() {
            window.location.href = 'cv-templates.html';
        }
    </script>
</body>
</html>
