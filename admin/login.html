<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Login - Nedhub GH Careers System">
    <title>Admin Login | Nedhub GH</title>
    <link rel="icon" type="image/png" href="../Nedhubsymbol.PNG">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-login-body">
    <div class="admin-login-container">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <div class="admin-logo">
                    <img src="../Nedhublogo.PNG" alt="Nedhub GH" style="height: 40px;">
                </div>
                <h1>Admin Panel</h1>
                <p>Enter your credentials to access the dashboard</p>
            </div>
            
            <form id="adminLoginForm" class="admin-login-form">
                <div class="form-group">
                    <label for="adminPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input 
                        type="password" 
                        id="adminPassword" 
                        name="password" 
                        placeholder="Enter admin password"
                        required
                        autocomplete="current-password"
                    >
                    <div class="error-message" id="loginError"></div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-icon">→</span>
                </button>
            </form>
            
            <div class="admin-login-footer">
                <a href="../index.html">← Back to Website</a>
            </div>
        </div>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
