<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Login - Nedhub GH Careers System">
    <title>Admin Login | Nedhub GH</title>
    <link rel="icon" type="image/png" href="../Nedhubsymbol.PNG">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-login-body">
    <div class="admin-login-container">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <div class="admin-logo">
                    <img src="../Nedhublogo.PNG" alt="Nedhub GH" style="height: 40px;">
                </div>
                <h1>Admin Panel</h1>
                <p>Enter your credentials to access the dashboard</p>
            </div>
            
            <form id="adminLoginForm" class="admin-login-form">
                <div class="form-group">
                    <label for="adminEmail">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input 
                        type="email" 
                        id="adminEmail" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </div>
                
                <div class="form-group">
                    <label for="adminPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input 
                        type="password" 
                        id="adminPassword" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                    <div class="error-message" id="loginError"></div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-icon">→</span>
                </button>
            </form>
            
            <div class="admin-login-footer">
                <a href="register.html" id="registerLink" style="display: none;">Initial Setup - Create Owner Account</a>
                <a href="../index.html">← Back to Website</a>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            apiBaseUrl: 'https://nedhub-production.up.railway.app/api',
            tokenKey: 'nedhub_admin_token'
        };

        document.addEventListener('DOMContentLoaded', function() {
            // Check if no admins exist and show registration link
            fetch(`${CONFIG.apiBaseUrl}/admin/health`, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(result => {
                if (result.adminCount === 0) {
                    document.getElementById('registerLink').style.display = 'block';
                }
            })
            .catch(() => {});

            const form = document.getElementById('adminLoginForm');
            const errorEl = document.getElementById('loginError');
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('adminEmail').value;
                const password = document.getElementById('adminPassword').value;
                
                try {
                    const response = await fetch(`${CONFIG.apiBaseUrl}/admin/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        localStorage.setItem(CONFIG.tokenKey, result.token);
                        window.location.href = 'index.html';
                    } else {
                        errorEl.textContent = result.message || 'Login failed';
                    }
                } catch (error) {
                    errorEl.textContent = 'Connection error. Please try again.';
                }
            });
        });
    </script>
</body>
</html>
